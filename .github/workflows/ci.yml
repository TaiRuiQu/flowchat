name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and package Windows
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_ENABLE_LOGGING: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Run offline tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Test Electron UI
        run: npm run test:ui

      - name: Test visual layout boundaries
        run: npm run test:layout

      - name: Build Windows installer
        run: npx --no-install electron-builder --win nsis --x64 --publish never

      - name: Test packaged application
        run: node tools/smoke-package.mjs

      - name: Create portable archive and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $output = '.artifacts/electron'
          Compress-Archive -Path "$output/win-unpacked/*" -DestinationPath "$output/FlowChat-$version-x64-portable.zip"
          Get-ChildItem "$output/*.exe", "$output/*.zip" | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$output/SHA256SUMS.txt" -Encoding utf8NoBOM

      - name: Upload Windows packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FlowChat-windows-x64
          path: |
            .artifacts/electron/*.exe
            .artifacts/electron/*.zip
            .artifacts/electron/SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Upload UI screenshots and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Electron-UI-results
          path: |
            .artifacts/electron-qa/**/*.png
            .artifacts/electron-qa/**/result.json
            .artifacts/feature-qa/**/*.png
            .artifacts/feature-qa/**/result.json
            .artifacts/layout-qa/**/*.png
            .artifacts/layout-qa/**/measurements.json
            .artifacts/markdown-editor-qa/**/*.png
            .artifacts/font-qa/**/*.png
            .artifacts/font-qa/**/report.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8')); if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Tag must match package.json version');"

      - name: Download tested packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FlowChat-windows-x64
          path: packages

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" packages/* --verify-tag --title "FlowChat $RELEASE_TAG" --generate-notes
